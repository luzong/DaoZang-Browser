  const container = document.getElementById('dynamic-toc');

  function buildTOC() {
    let html = '';
    let navHtml = '';
    for (let i = 0; i < daozangData.length; i++) {
      const ji = daozangData[i];
      navHtml += `<span class="constellation-card" onclick="scrollToSection('${ji.id}')">${ji.name}</span>`;
      html += `<div class="ji-section" id="${ji.id}">`;
      html += `<div class="ji-title" onclick="toggleSection('${ji.id}')">`;
      html += `<span>${ji.name} <small class="entry-count">(${ji.entries.length}条  )</small></span>`;
      html += `<span class="collapse-icon">▼</span></div>`;
      html += `<ul class="entry-list" id="list-${ji.id}" style="max-height: 40000px;">`;
      for (let j = 0; j < ji.entries.length; j++) {
        const e = ji.entries[j];
        const realPage = e.page + ji.offset;
        html += `<li class="entry-item" data-search="${e.title.toLowerCase()}">`;
        html += `<span class="clickable-entry" onclick="openPDF('${ji.file}', ${realPage})" title="打开 ${ji.file} 第${realPage}页（原始${e.page} ）">`;
        html += `<span class="entry-title">${e.title}</span>`;
        html += `<span class="entry-page">📄 ${e.page}</span>`;
        html += `</span></li>`;
      }
      html += `</ul></div>`;
    }
    quickNav.innerHTML = navHtml;
    container.innerHTML = html;
  }

  window.openPDF = function(fileName, realPageNumber) {
    const url = basePath + fileName + '#page=' + realPageNumber;
    window.open(url, '_blank');
  };

  window.toggleSection = function(id) {
    const list = document.getElementById('list-' + id);
    const title = document.getElementById(id).querySelector('.ji-title');
    if (list.classList.contains('collapsed')) {
      list.classList.remove('collapsed');
      list.style.maxHeight = list.scrollHeight + 'px';
      title.classList.remove('collapsed');
    } else {
      list.style.maxHeight = list.scrollHeight + 'px';
      requestAnimationFrame(() => {
        list.classList.add('collapsed');
        list.style.maxHeight = '0px';
        title.classList.add('collapsed');
      });
    }
  };

  window.scrollToSection = function(id) {
    const navHeight = document.querySelector('.top-nav').offsetHeight;
    const el = document.getElementById(id);
    if (el) {
      const elementPosition = el.getBoundingClientRect().top + window.pageYOffset;
      const offsetPosition = elementPosition - navHeight - 20;
      window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
      el.style.transition = 'background 0.5s';
      el.style.background = '#f5e7d5';
      setTimeout(() => { el.style.background = ''; }, 1500);
    }
  };

  window.filterEntries = function() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const noResult = document.getElementById('noResult');
    let foundAny = false;
    for (let i = 0; i < daozangData.length; i++) {
      const ji = daozangData[i];
      const section = document.getElementById(ji.id);
      const list = document.getElementById('list-' + ji.id);
      let sectionVisible = false;
      for (let j = 0; j < ji.entries.length; j++) {
        const item = list.children[j];
        if (!item) continue;
        if (query === '' || ji.entries[j].title.toLowerCase().includes(query)) {
          item.classList.remove('hidden');
          sectionVisible = true;
          if (query !== '') foundAny = true;
        } else {
          item.classList.add('hidden');
        }
      }
      section.classList.toggle('hidden-section', !sectionVisible && query !== '');
      if (query === '') {
        list.classList.remove('collapsed');
        list.style.maxHeight = '40000px';
        section.querySelector('.ji-title').classList.remove('collapsed');
      }
    }
    noResult.style.display = (!foundAny && query !== '') ? 'block' : 'none';
  };

  const backBtn = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    backBtn.classList.toggle('show', window.scrollY > 400);
  });
  backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  buildTOC();
})();
